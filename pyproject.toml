[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standort-agent"
version = "0.1.0"
description = "Explainable multi-agent location ranking PoC"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "langgraph",
    "gradio",
    "jinja2",
    "groq>=1.7.0",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
